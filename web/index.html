<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--
    This page handles a Nightscout read-only token and an AAPS master password, so the
    script surface is locked down: only this origin may supply script to the page, and nothing
    may be posted anywhere. The engine runs in a worker (engine.js), which loads Pyodide from
    the pinned CDN after checking its SHA-384 against the value pinned there. Pyodide compiles CPython to WASM, so
    'unsafe-eval'/'wasm-unsafe-eval' are unavoidable. connect-src has to allow any https
    host because the Nightscout URL is supplied by the user at runtime.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    connect-src 'self' https: blob:;
    worker-src 'self' blob:;
    img-src 'self' data:;
    base-uri 'none';
    form-action 'none';
    object-src 'none';
  " />
  <title>oref digital twin</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 44rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    label { display: block; margin: .6rem 0 .2rem; font-weight: 600; }
    input, select { width: 100%; padding: .5rem; box-sizing: border-box; }
    button { margin-top: 1rem; padding: .6rem 1rem; font-size: 1rem; cursor: pointer; }
    #status { color: #888; margin: 1rem 0; }
    #report { border-top: 1px solid #8884; margin-top: 1.5rem; padding-top: 1rem; }
    .muted { color: #888; font-size: .9rem; }
    .warn { color: #b45; }
    .scroll { overflow-x: auto; }
    fieldset.aim { border: 1px solid #8884; margin: .8rem 0 0; padding: .4rem .8rem; }
    fieldset.aim label { font-weight: 400; display: flex; gap: .5rem; align-items: baseline; }
    fieldset.aim input { width: auto; }
    table { border-collapse: collapse; font-size: .85rem; margin: .5rem 0; }
    th, td { border-bottom: 1px solid #8884; padding: .25rem .5rem; text-align: left; white-space: nowrap; }
  </style>
</head>
<body>
  <h1>oref digital twin</h1>
  <p class="muted">Read-only, advisory-only. Your Nightscout token and data stay in this
    browser — they are never sent to any server. Not medical advice.</p>

  <label for="url">Nightscout URL</label>
  <input id="url" placeholder="https://your-nightscout.example" />
  <label for="token">Access token (read-only)</label>
  <input id="token" type="password" placeholder="token" />
  <label for="days">Days to analyse</label>
  <input id="days" type="number" value="7" min="1" max="90" />
  <label for="jurisdiction">Driving rules to quote in the report</label>
  <select id="jurisdiction">
    <option value="UK" selected>UK (DVLA)</option>
    <option value="EU">EU (Directive 2006/126/EC)</option>
    <option value="US">US (American Diabetes Association; rules vary by state)</option>
    <option value="none">None</option>
  </select>
  <fieldset class="aim">
    <legend>What the settings tests aim for</legend>
    <label><input type="radio" name="aim" value="standard" checked /> Time in range above 70%,
      time below 70 mg/dL under 2% <span class="muted">(standard)</span></label>
    <label><input type="radio" name="aim" value="tighter" /> Time in range above 80%,
      time below 70 mg/dL under 2% <span class="muted">(tighter)</span></label>
  </fieldset>
  <label for="maxiob">Max IOB <span class="muted">(optional — enables settings experiments)</span></label>
  <input id="maxiob" type="number" step="0.1" min="0" placeholder="e.g. 6" />
  <label for="prefsfile">Settings file <span class="muted">(optional — AAPS prefs export or Trio settings JSON; stays in your browser)</span></label>
  <input id="prefsfile" type="file" accept=".json,application/json" />
  <label for="prefspw">Master password <span class="muted">(AAPS encrypted files only — never leaves your device)</span></label>
  <input id="prefspw" type="password" />

  <button id="run" disabled>Analyse</button>

  <label style="margin-top:1.5rem"><input type="checkbox" id="narrate" /> Also generate a
    written summary (sends only anonymous findings — no data or token — to the narration service)</label>

  <p id="status">Loading Python runtime…</p>
  <div id="report"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
