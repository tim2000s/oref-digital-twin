name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle Python packages for Pyodide
        run: bash web/build.sh
      - name: Assemble site
        run: |
          mkdir -p _site
          cp web/index.html web/app.js web/engine.js web/nightscout.js \
             web/settings.js web/aaps_prefs.mjs web/oref-bundle.js web/odt-packages.zip \
             LICENSE THIRD_PARTY_NOTICES.txt _site/
      - name: Write the narration setting
        # Empty unless this repository sets the NARRATOR_URL variable (see INSTALL.md), in which
        # case the page offers a written summary from that Worker.
        env:
          NARRATOR_URL: ${{ vars.NARRATOR_URL }}
        run: |
          python3 -c 'import json, os; print("export const NARRATOR_URL = " + json.dumps(os.environ.get("NARRATOR_URL", "")) + ";")' > _site/config.js
          cat _site/config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
