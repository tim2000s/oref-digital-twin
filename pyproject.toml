[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oref-digital-twin"
version = "0.0.1"
description = "Advisory decision-support for AAPS/Trio settings — ingestion and analysis."
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
odt-ingest = "ingestion.cli:main"

[tool.setuptools.packages.find]
include = ["ingestion*", "variant*", "diagnostics*", "replay*", "settings*", "report*"]

[tool.pytest.ini_options]
testpaths = ["ingestion/tests", "variant/tests", "diagnostics/tests", "replay/tests",
             "settings/tests", "report/tests"]
